<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="qTitle qDesc">
  <title id="qTitle">Outlier sets the scale</title>
  <desc id="qDesc">Four bars. Three are short. One is tall. The tall bar sets the quantisation step, so the short bars fall into a few codes or zero.</desc>
  <rect width="640" height="360" fill="#efe8d8"/>
  <text x="32" y="42" fill="#1c1914" font-family="IBM Plex Sans, sans-serif" font-size="22">The scale</text>
  <rect x="48" y="230" width="48" height="40" fill="#1c1914"/>
  <rect x="120" y="246" width="48" height="24" fill="#1c1914"/>
  <rect x="192" y="258" width="48" height="12" fill="#1c1914"/>
  <rect x="264" y="80" width="48" height="190" fill="#e2a322"/>
  <text x="340" y="120" fill="#1c1914" font-family="IBM Plex Sans, sans-serif" font-size="16">This one sets amax.</text>
  <text x="340" y="156" fill="#1c1914" font-family="IBM Plex Sans, sans-serif" font-size="16">The step is amax / levels.</text>
  <text x="340" y="192" fill="#1c1914" font-family="IBM Plex Sans, sans-serif" font-size="16">Smaller values round down.</text>
  <text x="32" y="320" fill="#5c574c" font-family="IBM Plex Mono, monospace" font-size="12">Texture goes flat before you see a NaN.</text>
</svg>
